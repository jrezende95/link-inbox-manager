name: Feature request
description: Propose an improvement to inbound LinkedIn triage
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Do not include real messages, profiles, credentials, screenshots, logs, browser data, or private policies.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What inbound-triage problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Core inbound triage
        - Optional extension
        - Documentation or onboarding
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Security and privacy considerations
    validations:
      required: true
